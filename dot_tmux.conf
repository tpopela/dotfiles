if-shell 'test -z "$SSH_CONNECTION" -a ! -e /var/run/.toolboxenv' \
   'source-file ~/.tmux.conf.local'

if-shell 'test -n "$SSH_CONNECTION" -o -e /var/run/.toolboxenv' \
   'source-file ~/.tmux.conf.remote'

# Stop listening sooner for another tmux commands, after the current one is executed
# The default value 500 caused me problems in vim
set-option -g repeat-time 200

# Start the windows indexed from 1 (and not 0)
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Don't notify about window's activity
setw -g monitor-activity off
set -g visual-activity off

# Xterm support
# setw -g xterm-keys on

# Vi shortcuts support (clipboard, selection, search)
setw -g mode-keys vi

# When closing a windows, renumber the current ones so we don't have unused indexes
set-option -g renumber-windows on

# Split window horizontally with |
bind | split-window -h -c "#{pane_current_path}"
unbind '"'

# Split window vertically with -
bind - split-window -c "#{pane_current_path}"
unbind %

# Creating a new window will create it with the pane's current path
bind c new-window -c "#{pane_current_path}"

#set-window-option -g window-status-style bg=colour236
set-window-option -g window-status-current-style bg=blue

bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window

## STATUS LINE ##
set -g status-fg white

set -g status-left-length 80
set -g status-left "#[fg=white] %H:%M | #h | #S #I:#P"

set -g status-right-length 80
#set -g status-right "#{prefix_highlight}"

set-option -g status-style fg=white,bg=colour235
set-option -g status-style dim

# set pane colors - highlight the active pane
set-option -g pane-border-style fg=blue
set-option -g pane-active-border-style fg=lightblue

# colorize messages in the command line
set-option -g message-style bg=black,fg=red

set -g status-justify centre

## PLUGINS ##
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @override_copy_command 'xclip -se c -i && xclip -o -se c | xclip -se p -i'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

#set -g @plugin 'christoomey/vim-tmux-navigator'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
